[project]
name = "hiver-support-agent"
version = "1.0.0"
description = "Autonomous AI customer support agent with intent classification, FAISS retrieval, and escalation logic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "pydantic==2.7.1",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pyarrow==16.1.0",
    "scikit-learn==1.5.0",
    "faiss-cpu==1.8.0",
    "openai==1.30.0",
]

[tool.vercel]
entrypoint = "src.api:app"
